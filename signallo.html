<!DOCTYPE html>
<html lang="so">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SOM VIP SIGNALS - Premium Live Forex</title>
    <style>
        :root {
            --bg-color: #06090f;
            --card-bg: #0d1117;
            --text-color: #f0f6fc;
            --accent-green: #238636;
            --accent-red: #da3633;
            --blue-glow: #1f6feb;
            --border-color: #30363d;
        }

        body {
            font-family: '-apple-system', BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
            width: 100%;
            max-width: 1200px;
        }

        header h1 {
            color: var(--text-color);
            font-size: 2.5rem;
            margin: 0;
            letter-spacing: 1px;
        }

        header h1 span {
            color: #e3b341;
            text-shadow: 0 0 10px rgba(227, 179, 65, 0.3);
        }

        header p {
            color: #8b949e;
            font-size: 1.1rem;
            margin-top: 5px;
        }

        /* VIP Tools Section (Search & WhatsApp) */
        .vip-tools {
            display: flex;
            gap: 15px;
            margin-bottom: 25px;
            width: 100%;
            max-width: 1200px;
            flex-wrap: wrap;
        }

        #pairSearch {
            flex: 1;
            min-width: 250px;
            padding: 12px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            background: var(--card-bg);
            color: white;
            font-size: 1rem;
        }

        .whatsapp-btn {
            background-color: #25d366;
            color: white;
            padding: 12px 24px;
            border-radius: 6px;
            text-decoration: none;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 1rem;
            transition: background 0.2s ease, transform 0.1s ease;
            box-shadow: 0 4px 12px rgba(37, 211, 102, 0.2);
        }

        .whatsapp-btn:hover {
            background-color: #20ba5a;
            transform: translateY(-2px);
        }

        /* Main Dashboard Container */
        .dashboard-container {
            width: 100%;
            max-width: 1200px;
            height: 650px; /* Boos weyn oo ku habboon moobilka iyo pc-ga */
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }

        .footer-note {
            margin-top: 40px;
            color: #8b949e;
            font-size: 0.9rem;
            text-align: center;
        }
    </style>
</head>
<body>

<header>
    <h1>SOM <span>VIP SIGNALS</span></h1>
    <p>Nidaamka Falanqaynta Tooska Ah ee Suuqa Forex (100% Real Market Decisions)</p>
</header>

<div class="vip-tools">
    <input type="text" id="pairSearch" placeholder="🔍 Ka raadi lammaanaha lacagaha halkan..." disabled style="opacity: 0.6; cursor: not-allowed;">
    <a href="https://wa.me/252907492663" class="whatsapp-btn" target="_blank">💬 Caawimaad Gaara & VIP Strategy</a>
</div>

<div class="dashboard-container">
    <div class="tradingview-widget-container" style="height:100%;width:100%;">
        <div id="tradingview_forex_signals" style="height:100%;width:100%;"></div>
        <script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>
        <script type="text/javascript">
        new TradingView.MediumWidget({
            "symbols": [
                ["EUR/USD", "FX:EURUSD|15m"],
                ["GBP/USD", "FX:GBPUSD|15m"],
                ["USD/JPY", "FX:USDJPY|15m"],
                ["AUD/USD", "FX:AUDUSD|15m"],
                ["USD/CAD", "FX:USDCAD|15m"],
                ["USD/CHF", "FX:USDCHF|15m"],
                ["NZD/USD", "FX:NZDUSD|15m"],
                ["EUR/GBP", "FX:EURGBP|15m"]
            ],
            "chartOnly": false,
            "width": "100%",
            "height": "100%",
            "locale": "en",
            "colorTheme": "dark",
            "gridLineColor": "rgba(42, 46, 57, 0)",
            "trendLineColor": "#1f6feb",
            "fontColor": "#787b86",
            "underLineColor": "rgba(0, 150, 136, 0.3)",
            "underLineBottomColor": "rgba(0, 150, 136, 0)",
            "isTransparent": false,
            "autosize": true,
            "container_id": "tradingview_forex_signals"
        });
        </script>
    </div>
</div>

<div class="footer-note">
    <p>&copy; 2026 SOM VIP SIGNALS. Dhammaan xogta iyo calaamadaha (BUY/SELL) waxay si toos ah u shaqaynayaan iyadoo la adeegsanayo nidaamka suuqyada caalamiga ah.</p>
</div>

</body>
</html>
