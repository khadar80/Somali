<!DOCTYPE html>
<html lang="so">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SOM VIP SIGNALS - Premium Live Forex</title>
    <style>
        :root {
            --bg-color: #06090f;
            --card-bg: #0d1117;
            --text-color: #f0f6fc;
            --accent-green: #238636;
            --accent-red: #da3633;
            --blue-glow: #1f6feb;
            --border-color: #30363d;
        }

        body {
            font-family: '-apple-system', BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        header {
            text-align: center;
            margin-bottom: 20px;
            width: 100%;
            max-width: 600px;
        }

        header h1 {
            color: var(--text-color);
            font-size: 2.2rem;
            margin: 0;
            letter-spacing: 1px;
        }

        header h1 span {
            color: #e3b341;
            text-shadow: 0 0 10px rgba(227, 179, 65, 0.3);
        }

        header p {
            color: #8b949e;
            font-size: 1rem;
            margin-top: 5px;
        }

        .vip-tools {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 25px;
            width: 100%;
            max-width: 500px;
        }

        .whatsapp-btn {
            background-color: #25d366;
            color: white;
            padding: 14px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-size: 1.1rem;
            box-shadow: 0 4px 12px rgba(37, 211, 102, 0.2);
            transition: transform 0.1s ease;
        }

        .whatsapp-btn:hover {
            transform: translateY(-2px);
        }

        /* Navigaatorka Currency Pairs-ka */
        .pair-selectors {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            width: 100%;
            max-width: 500px;
            padding-bottom: 10px;
            margin-bottom: 15px;
        }

        .pair-selectors::-webkit-scrollbar {
            height: 4px;
        }

        .pair-selectors::-webkit-scrollbar-thumb {
            background: var(--border-color);
            border-radius: 4px;
        }

        .p-btn {
            background-color: var(--card-bg);
            color: var(--text-color);
            border: 1px solid var(--border-color);
            padding: 10px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
            white-space: nowrap;
        }

        .p-btn.active {
            background-color: #e3b341;
            color: #000;
            border-color: #e3b341;
        }

        /* Dashboard Container ka */
        .signal-box {
            width: 100%;
            max-width: 500px;
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 5px;
            box-shadow: 0 4px 25px rgba(0,0,0,0.5);
            height: 450px; /* Boos sax ah oo loogu talagalay Gauge-ka shaashadda moobilka */
        }

        .footer-note {
            margin-top: 30px;
            color: #8b949e;
            font-size: 0.85rem;
            text-align: center;
            max-width: 500px;
        }
    </style>
</head>
<body>

<header>
    <h1>SOM <span>VIP SIGNALS</span></h1>
    <p>Go'aamo Toos Ah oo ku Salaysan Qiimaha Suuqa (100% Real-Time Decisions)</p>
</header>

<div class="vip-tools">
    <a href="https://wa.me/252907492663" class="whatsapp-btn" target="_blank">💬 Caawimaad Gaara & VIP Strategy</a>
</div>

<!-- Liiska lammaanaha lacagaha ee loo dhex weynayo -->
<div class="pair-selectors">
    <button class="p-btn active" onclick="changePair('FX:EURUSD', this)">EUR/USD</button>
    <button class="p-btn" onclick="changePair('FX:GBPUSD', this)">GBP/USD</button>
    <button class="p-btn" onclick="changePair('FX:USDJPY', this)">USD/JPY</button>
    <button class="p-btn" onclick="changePair('FX:AUDUSD', this)">AUD/USD</button>
    <button class="p-btn" onclick="changePair('FX:USDCAD', this)">USD/CAD</button>
    <button class="p-btn" onclick="changePair('FX:USDCHF', this)">USD/CHF</button>
</div>

<!-- Meesha uu ka soo muuqanayo Signal-ka rasmiga ah ee leh go'aanka BUY/SELL -->
<div class="signal-box" id="widgetContainer">
    <!-- TradingView Technical Analysis Widget -->
    <div class="tradingview-widget-container" style="height:100%;width:100%;">
        <div id="tradingview_analysis_widget" style="height:100%;width:100%;"></div>
    </div>
</div>

<div class="footer-note">
    <p>&copy; 2026 SOM VIP SIGNALS. Signal-kani waa mid dhab ah oo xisaabinaya tilmaamayaasha farsamada (RSI, Moving Averages) ee qiimaha suuqyada hadda taagan.</p>
</div>

<!-- Soo jiidashada Script-ka rasmiga ah ee guurguura -->
<script type="text/javascript" src="https://s3.tradingview.com/external-embedding/embed-widget-technical-analysis.js" async></script>

<script>
    let currentSymbol = "FX:EURUSD";

    function loadWidget() {
        // Clear-garee container-ka ka hor intaanan dib u dhisin
        const container = document.getElementById("tradingview_analysis_widget");
        container.innerHTML = "";

        const widgetScript = document.createElement("script");
        widgetScript.type = "text/javascript";
        widgetScript.src = "https://s3.tradingview.com/external-embedding/embed-widget-technical-analysis.js";
        widgetScript.async = true;

        // Kani waa nidaamka muujinaya mishiinka go'aanka (Gauges) ee leh BUY/SELL iyo Timeframes ee moobilka ku habboon
        widgetScript.innerHTML = JSON.stringify({
            "interval": "15m",
            "width": "100%",
            "isDtoNotModify": false,
            "isDataReady": true,
            "height": "100%",
            "symbol": currentSymbol,
            "showIntervalTabs": true, /* Tani waxay qofka u ogolaanaysaa inuu moobilka ka doorto 1m, 5m, 15m, 1h, 1d */
            "displayMode": "live",
            "locale": "en",
            "colorTheme": "dark"
        });

        container.appendChild(widgetScript);
    }

    function changePair(symbol, element) {
        currentSymbol = symbol;
        
        // Beddel naqshadda badhanka la doortay
        const buttons = document.querySelectorAll('.p-btn');
        buttons.forEach(btn => btn.classList.remove('active'));
        element.classList.add('active');
        
        loadWidget();
    }

    // Markay mareegtu dhalato toos u kici widget-ka
    window.onload = loadWidget;
</script>

</body>
</html>
