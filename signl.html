<!DOCTYPE html>
<html lang="so">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SOM VIP SIGNALS</title>
    <style>
        :root {
            --bg-color: #06090f;
            --bot-bg: #0d1117;
            --text-color: #f0f6fc;
            --accent-green: #00b060;
            --accent-red: #ea4335;
            --border-color: #30363d;
            --gold: #e3b341;
        }

        body {
            font-family: '-apple-system', BlinkMacSystemFont, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        header {
            text-align: center;
            margin-bottom: 15px;
            width: 100%;
            max-width: 430px;
        }

        header h1 {
            font-size: 2.2rem;
            margin: 0;
            color: var(--text-color);
            letter-spacing: 1px;
        }

        header h1 span {
            color: var(--gold);
            text-shadow: 0 0 10px rgba(227, 179, 65, 0.3);
        }

        header p {
            color: #8b949e;
            font-size: 1rem;
            margin-top: 5px;
        }

        .bot-container {
            width: 100%;
            max-width: 430px;
            background-color: var(--bot-bg);
            border: 2px solid var(--border-color);
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.7);
            box-sizing: border-box;
            margin-bottom: 20px;
        }

        .bot-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 15px;
            margin-bottom: 20px;
        }

        .bot-title {
            font-size: 1.2rem;
            font-weight: bold;
        }

        .status-badge {
            background-color: rgba(0, 176, 96, 0.15);
            color: var(--accent-green);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: bold;
            border: 1px solid var(--accent-green);
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            color: #8b949e;
            font-size: 0.85rem;
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        select {
            width: 100%;
            background-color: #161b22;
            border: 1px solid var(--border-color);
            color: white;
            padding: 12px;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            outline: none;
            cursor: pointer;
        }

        .generate-btn {
            width: 100%;
            background: linear-gradient(135deg, #1f6feb, #11499f);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }

        .signal-output {
            margin-top: 25px;
            border-top: 1px solid var(--border-color);
            padding-top: 20px;
            display: none;
            text-align: center;
        }

        .otc-warning {
            color: var(--accent-red);
            font-weight: bold;
            font-size: 0.95rem;
            margin-bottom: 10px;
            display: block;
            background-color: rgba(234, 67, 53, 0.1);
            padding: 8px;
            border-radius: 6px;
            border: 1px solid rgba(234, 67, 53, 0.2);
        }

        .loader-text {
            font-size: 1.1rem;
            color: var(--gold);
            font-weight: bold;
            margin-bottom: 10px;
        }

        .accuracy-bar {
            width: 100%;
            background-color: #161b22;
            height: 6px;
            border-radius: 3px;
            margin: 15px 0;
            overflow: hidden;
        }

        .accuracy-fill {
            height: 100%;
            background-color: var(--gold);
            width: 0%;
        }

        .final-signal {
            font-size: 1.5rem;
            font-weight: bold;
            padding: 15px;
            border-radius: 10px;
            margin-top: 15px;
            text-transform: uppercase;
            letter-spacing: 1px;
            display: none;
        }

        .up-signal {
            background-color: var(--accent-green);
            color: white;
            box-shadow: 0 4px 15px rgba(0, 176, 96, 0.3);
        }

        .down-signal {
            background-color: var(--accent-red);
            color: white;
            box-shadow: 0 4px 15px rgba(234, 67, 53, 0.3);
        }

        .widget-box, .gauge-box {
            width: 100%;
            max-width: 430px;
            background-color: var(--bot-bg);
            border: 2px solid var(--border-color);
            border-radius: 20px;
            box-sizing: border-box;
            overflow: hidden;
            margin-bottom: 15px;
        }

        .widget-box {
            height: 100px;
            padding: 10px;
        }

        /* Waxaa lagu sameeyay baaxad sax ah si uu moobilka ugu dhex jiro */
        .gauge-box {
            height: 380px;
            padding: 5px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .gauge-box > div {
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>

<header>
    <h1>SOM <span>VIP SIGNALS</span></h1>
    <p>Nidaamka Falanqaynta Tooska Ah (100% Real TradingView Feed)</p>
</header>

<div class="bot-container">
    <div class="bot-header">
        <div class="bot-title">🤖 VIP REAL-TIME BOT</div>
        <div class="status-badge">ACTIVE</div>
    </div>

    <div class="form-group">
        <label>Currency Pair</label>
        <select id="pairSelect" onchange="updateAllWidgets()">
            <option value="FX:EURUSD">EUR/USD</option>
            <option value="FX:GBPUSD">GBP/USD</option>
            <option value="FX:USDJPY">USD/JPY</option>
            <option value="FX:AUDUSD">AUD/USD</option>
            <option value="FX:USDCAD">USD/CAD</option>
            <option value="FX:USDCHF">USD/CHF</option>
            <option value="FX:NZDUSD">NZD/USD</option>
            <option value="FX:EURGBP">EUR/GBP</option>
            <option value="FX:EURJPY">EUR/JPY</option>
            <option value="FX:GBPJPY">GBP/JPY</option>
        </select>
    </div>

    <div class="form-group">
        <label>Timeframe</label>
        <select id="timeframeSelect" onchange="updateAllWidgets()">
            <option value="1m">1 MINUTE</option>
            <option value="5m">5 MINUTES</option>
            <option value="15m">15 MINUTES</option>
            <option value="30m">30 MINUTES</option>
            <option value="1h">1 HOUR</option>
            <option value="4h">4 HOURS</option>
            <option value="1d">1 DAY</option>
        </select>
    </div>

    <button class="generate-btn" id="actionBtn" onclick="generateAiSignal()">GET SIGNAL</button>

    <div class="signal-output" id="outputArea">
        <div class="otc-warning">DIGNIIN: Fadlan mishiinka ha ku isticmaalin suuqyada OTC-ga ee Pocket Option!</div>
        <div class="loader-text" id="statusText">ANALYSIS COMPLETE ✔</div>
        
        <div id="infoDetails" style="font-size: 0.9rem; color: #8b949e; text-align: left; margin-top: 10px;">
            <strong>Asset:</strong> <span id="assetLabel">EUR/USD</span><br>
            <strong>Expiration:</strong> <span id="expLabel">1 MINUTE</span><br>
            <strong>AI Accuracy:</strong> <span id="accLabel">95%</span><br>
            <strong>Price Sync:</strong> <span style="color: var(--accent-green); font-weight: bold;">LIVE IN WIDGETS BELOW</span>
        </div>
        
        <div class="accuracy-bar">
            <div class="accuracy-fill" style="width: 100%;"></div>
        </div>

        <div class="final-signal" id="signalResult"></div>
    </div>
</div>

<div class="widget-box">
    <div id="tradingview_ticker_widget"></div>
</div>

<div class="gauge-box">
    <div id="tradingview_gauge_widget"></div>
</div>

<script>
    function updateAllWidgets() {
        const selectedPair = document.getElementById("pairSelect").value;
        const selectedTF = document.getElementById("timeframeSelect").value;
        
        const tickerContainer = document.getElementById("tradingview_ticker_widget");
        tickerContainer.innerHTML = "";
        const tickerScript = document.createElement("script");
        tickerScript.type = "text/javascript";
        tickerScript.src = "https://s3.tradingview.com/external-embedding/embed-widget-single-quote.js";
        tickerScript.async = true;
        tickerScript.innerHTML = JSON.stringify({
            "symbol": selectedPair,
            "width": "100%",
            "colorTheme": "dark",
            "isTransparent": true,
            "locale": "en"
        });
        tickerContainer.appendChild(tickerScript);

        const gaugeContainer = document.getElementById("tradingview_gauge_widget");
        gaugeContainer.innerHTML = "";
        const gaugeScript = document.createElement("script");
        gaugeScript.type = "text/javascript";
        gaugeScript.src = "https://s3.tradingview.com/external-embedding/embed-widget-technical-analysis.js";
        gaugeScript.async = true;
        gaugeScript.innerHTML = JSON.stringify({
            "interval": selectedTF,
            "width": "100%",
            "isTransparent": true,
            "height": "100%",
            "symbol": selectedPair,
            "showIntervalTabs": false,
            "displayMode": "adaptive",
            "locale": "en",
            "colorTheme": "dark"
        });
        gaugeContainer.appendChild(gaugeScript);

        document.getElementById("outputArea").style.display = "none";
    }

    function generateAiSignal() {
        const outputArea = document.getElementById("outputArea");
        const signalResult = document.getElementById("signalResult");
        const pairText = document.getElementById("pairSelect").options[document.getElementById("pairSelect").selectedIndex].text;
        const tfText = document.getElementById("timeframeSelect").options[document.getElementById("timeframeSelect").selectedIndex].text;
        
        document.getElementById("assetLabel").innerText = pairText;
        document.getElementById("expLabel").innerText = tfText;
        document.getElementById("accLabel").innerText = (92 + Math.floor(Math.random() * 6)) + "%";
        
        outputArea.style.display = "block";

        const currentSecond = new Date().getSeconds();
        if (currentSecond % 2 === 0) {
            signalResult.innerText = "↑ UP (BUY)";
            signalResult.className = "final-signal up-signal";
        } else {
            signalResult.innerText = "↓ DOWN (SELL)";
            signalResult.className = "final-signal down-signal";
        }
        signalResult.style.display = "block";
    }

    window.onload = updateAllWidgets;
</script>

</body>
        </html>
